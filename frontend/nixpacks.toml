# Railway / Nixpacks — config do frontend Next.js 16
# Apenas define variáveis de ambiente. NÃO sobrescreve as fases de
# install/build do Nixpacks (deixa a auto-detecção do Next.js funcionar).
# NODE_OPTIONS aumenta o heap para evitar OOM do Turbopack no build.

[variables]
NODE_OPTIONS = "--max-old-space-size=4096"
NEXT_TELEMETRY_DISABLED = "1"
